<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Резюме | Мельничук Максим</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Лабораторна №4: скрипт підключено в head без defer, щоб тема встановилась до першого малювання сторінки -->
  <script src="script.js"></script>
</head>
<body>

  <header class="header">
    <div class="header-container">
      <h1>Мельничук Максим Романович</h1>
      <p class="subtitle">Студент групи КБ | Кібербезпека</p>
      
      <!-- Перемикач теми -->
      <button id="theme-toggle" type="button" class="theme-btn" aria-pressed="false">
        <span class="theme-toggle-label">Денна тема</span>
      </button>
    </div>
  </header>

  <main class="main-container">

    <!-- Секція «Відгуки роботодавців» -->
    <section id="reviews" class="reviews-section">
      <h2>Відгуки роботодавців</h2>
      <p id="reviews-status" class="reviews-status" role="status">Завантаження відгуків...</p>
      <ol id="reviews-list" class="reviews-list"></ol>
    </section>

  </main>

  <!-- Футер з блоком системної інформації з localStorage -->
  <footer class="footer">
    <div class="footer-container">
      <h3>Ваша система (дані з localStorage):</h3>
      <dl id="sysinfo-list" class="sysinfo-list"></dl>
      <p class="copyright">© 2026 Мельничук Максим</p>
    </div>
  </footer>

  <!-- Форма зворотного зв'язку: відкривається через 1 хвилину на сайті -->
  <dialog id="feedback" class="feedback-dialog" aria-labelledby="feedback-title">
    <div class="feedback-head">
      <h2 id="feedback-title">Напишіть мені</h2>
      <button id="feedback-close" type="button" aria-label="Закрити форму">&times;</button>
    </div>
    <p class="feedback-lead">Маєте пропозицію чи питання? Лист прийде мені на пошту.</p>
    
    <!-- Дані форми надсилає на пошту сервіс Formspree -->
    <form action="https://formspree.io/f/mnpponqq" method="POST" class="feedback-form">
      <label class="field">
        <span class="field-label">Ім'я</span>
        <input class="field-input" type="text" name="name" autocomplete="name" required />
      </label>
      
      <label class="field">
        <span class="field-label">Email</span>
        <input class="field-input" type="email" name="email" autocomplete="email" required />
      </label>
      
      <label class="field">
        <span class="field-label">Номер телефону</span>
        <input class="field-input" type="tel" name="phone" autocomplete="tel" placeholder="+380" />
      </label>
      
      <label class="field">
        <span class="field-label">Повідомлення</span>
        <textarea class="field-input" name="message" rows="5" required></textarea>
      </label>
      
      <button type="submit" class="submit-btn">Надіслати</button>
    </form>
  </dialog>

</body>
</html>
